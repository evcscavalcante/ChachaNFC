name: Aplicar tema Google suave

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google-soft-theme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar tema Material suave
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          html = html.replace(
              '<meta name="theme-color" content="#0f172a">',
              '<meta name="theme-color" content="#f8fafd">'
          )
          html = html.replace(
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">',
              '<meta name="apple-mobile-web-app-status-bar-style" content="default">'
          )

          theme = r'''
    /* GOOGLE_MATERIAL_SOFT_V1 */
    :root{
      --bg:#f8fafd;
      --card:#ffffff;
      --card2:#f8fafd;
      --line:#dfe3eb;
      --text:#202124;
      --muted:#5f6368;
      --blue:#e8f0fe;
      --green:#e6f4ea;
      --red:#fce8e6;
      --shadow:0 1px 3px rgba(60,64,67,.16),0 1px 2px rgba(60,64,67,.08)
    }
    body{background:#f8fafd;color:var(--text)}
    header{background:rgba(248,250,253,.96);border-bottom:1px solid #e0e3e7;box-shadow:0 1px 2px rgba(60,64,67,.06)}
    header p,.muted,.small{color:var(--muted)}
    .card{background:#fff;border:1px solid #e0e3e7;box-shadow:var(--shadow)}
    label{color:#3c4043}
    input,select{background:#fff;color:#202124;border-color:#c7cdd6}
    input::placeholder{color:#80868b}
    input:focus,select:focus{border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(138,180,248,.22)}
    .btn{background:#e8f0fe;color:#0b57d0;border:1px solid #c6dafc;box-shadow:none}
    .btn:hover{background:#dbe8fd;filter:none}
    .btn.secondary{background:#f1f3f4;color:#3c4043;border:1px solid #dadce0}
    .btn.ghost{background:#fff;color:#3c4043;border:1px solid #dadce0}
    .btn.good{background:#e6f4ea;color:#137333;border:1px solid #c7e7d0}
    .status{background:#f8fafd;color:#5f6368;border-color:#dfe3eb}
    .status.good{background:#e6f4ea;color:#137333;border-color:#c7e7d0}
    .status.warn{background:#fef7e0;color:#8a5a00;border-color:#f7e3a3}
    .status.bad{background:#fce8e6;color:#a50e0e;border-color:#f4c7c3}
    .nfc{background:#f8fafd;border-color:#a8c7fa}
    .nfc-icon{border-color:#8ab4f8;color:#0b57d0;background:#eef4ff}
    .person{background:#e6f4ea;border-color:#c7e7d0}
    .pill{background:#f1f3f4;color:#3c4043;border-color:#dadce0}
    .table-wrap{background:#fff;border-color:#dfe3eb}
    th{background:#f8fafd;color:#3c4043}
    th,td{border-bottom-color:#e8eaed}
    .link-btn{background:#f1f3f4;color:#3c4043;border-color:#dadce0}
    .link-btn.delete{background:#fce8e6;color:#a50e0e;border-color:#f4c7c3}
    .kpi{background:#fff;border-color:#dfe3eb}
    nav{background:rgba(255,255,255,.96);border-top:1px solid #e0e3e7;box-shadow:0 -1px 3px rgba(60,64,67,.08)}
    .tab{color:#5f6368}
    .tab.active{background:#e8f0fe;color:#0b57d0}
    dialog{background:#fff;color:#202124;border-color:#dadce0}
    dialog::backdrop{background:rgba(32,33,36,.38)}
    .dialog-actions{border-top-color:#e8eaed}
    @media(max-width:700px){
      #view-funcionarios tr{background:#fff;border-color:#dfe3eb}
      #view-funcionarios td{border-bottom-color:#e8eaed}
    }
          '''

          if "GOOGLE_MATERIAL_SOFT_V1" not in html:
              html = html.replace("  </style>", theme + "\n  </style>", 1)

          path.write_text(html, encoding="utf-8")
          PY

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Adota cores suaves no padrão Google"
          git push
